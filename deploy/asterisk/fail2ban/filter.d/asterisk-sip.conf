# ═══════════════════════════════════════════════════════════════
#  filter.d/asterisk-sip.conf — fail2ban para Asterisk (D3, Spec 05 §3.3)
#  Detecta fallos de registro/invite SIP en el log de seguridad de
#  Asterisk (logger.conf: security => security).
#  Instalar como: /etc/fail2ban/filter.d/asterisk-sip.conf (Debian)
# ═══════════════════════════════════════════════════════════════

[Definition]

failregex = ^.*Registration from '.*' failed for '<HOST>(:\d+)?' - (Wrong password|No matching endpoint|Username/auth name mismatch).*$
            ^.*Registration from '.*' failed for '<HOST>(:\d+)?' - No matching peer found$
            ^.*Authentication failed for '.*' from '<HOST>(:\d+)?'.*$
            ^.*SecurityEvent="(FailedACL|InvalidAccountID|ChanViolation|AuthFailure|ChallengeResponseFailed|InvalidPassword)".*RemoteAddress="<HOST>(:\d+)?".*$

ignoreregex =

# Timestamps de Asterisk: [2026-08-13 02:05:01]
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
