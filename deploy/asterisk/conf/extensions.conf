; ═══════════════════════════════════════════════════════════════
;  extensions.conf — IaaS-RonSys Central Telefónica (F2, Spec 05 §3.3)
;  R1: grabación obligatoria con MixMonitor (in y out); si la grabación
;  falla la llamada continúa (opción 'b' + Set CALL_RECORDING=1).
;  MVP: inbound ring a la extensión 100 del operador.
; ═══════════════════════════════════════════════════════════════

; ── Entrada desde el trunk (PSTN → operador) ────────────────────
[from-pstn]
exten => s,1,NoOp(Llamada entrante: ${CALLERID(num)} → ${EXTEN})
 same => n,MixMonitor(${UNIQUEID}.wav,b)      ; R1: grabación (continúa si falla)
 same => n,Set(CALL_RECORDING=1)
 same => n,Dial(PJSIP/100,30)                 ; MVP: ring al operador (ext 100)
 same => n,Hangup()

; ── Salida del operador (click-to-call Originate vía ARI, D4) ───
[from-internal]
; salida al trunk — R1 también en salientes
exten => _X.,1,NoOp(Outbound: ${CALLERID(num)} → ${EXTEN})
 same => n,MixMonitor(${UNIQUEID}.wav,b)      ; R1
 same => n,Dial(PJSIP/${EXTEN}@provider-trunk,60)
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────────
;  SOLO QA — contexto de simulación local SIN trunk (dry-run F1).
;  Descomentar junto con los endpoints 100/200/201 "SOLO QA" de
;  pjsip.conf para llamadas internas con grabación (R1). NO se usa
;  en producción.
; ─────────────────────────────────────────────────────────────────
; [from-qa]
; exten => _X.,1,NoOp(QA local: ${CALLERID(num)} → ${EXTEN})
;  same => n,MixMonitor(${UNIQUEID}.wav,b)     ; R1 (validación de grabación)
;  same => n,Dial(PJSIP/${EXTEN},30)
;  same => n,Hangup()
