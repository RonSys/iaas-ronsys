; ═══════════════════════════════════════════════════════════════
;  manager.conf (AMI) — IaaS-RonSys Central Telefónica (F2, Spec 05 §3.3)
;  D4: el adapter call-bridge escucha eventos AMI (CDR/estado/grabación).
;  D3: bind SOLO 127.0.0.1, puerto 5038 — NUNCA expuesto al exterior.
;  Credenciales: PLACEHOLDER (D3) — generar por secret:
;    openssl rand -hex 24   →  sustituir <GENERAR_POR_SECRET>
; ═══════════════════════════════════════════════════════════════

[general]
enabled = yes
webenabled = no
port = 5038
bindaddr = 127.0.0.1

; ── Usuario del call-bridge (D4) ────────────────────────────────
[callbridge]
secret = <GENERAR_POR_SECRET_32+_chars>
read = all
write = all
; displayconnects = no
