; ═══════════════════════════════════════════════════════════════
;  asterisk.conf — IaaS-RonSys Central Telefónica (F2, Spec 05 §3.3)
;  Rutas estándar Debian (la imagen asterisk/asterisk:20 es Debian-based).
;  Se monta en /etc/asterisk:ro — Asterisk no escribe aquí en runtime.
; ═══════════════════════════════════════════════════════════════

[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; Verbosidad de consola (útil para verificación en vivo con docker logs)
verbose = 3
