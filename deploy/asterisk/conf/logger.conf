; ═══════════════════════════════════════════════════════════════
;  logger.conf — IaaS-RonSys Central Telefónica (F2, Spec 05 §3.3)
;  - console: salida a stdout (docker logs)
;  - full:    log completo en archivo (depuración call-bridge)
;  - security: log de seguridad (D3) — REQUERIDO por fail2ban
;    (SecurityEventAuthFailure / Registration failed se leen de aquí)
; ═══════════════════════════════════════════════════════════════

[logfiles]
console => notice,warning,error
full => notice,warning,error,verbose,debug
security => security
