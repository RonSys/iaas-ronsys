; ═══════════════════════════════════════════════════════════════
;  ari.conf (ARI) — IaaS-RonSys Central Telefónica (F2, Spec 05 §3.3)
;  D4: el call-bridge controla Asterisk vía ARI (Originate/click-to-call).
;  D3: ARI hereda el bind de http.conf (127.0.0.1:8088) — NUNCA expuesto.
;  Credenciales: PLACEHOLDER (D3) — generar por secret:
;    openssl rand -hex 24   →  sustituir <GENERAR_POR_SECRET>
; ═══════════════════════════════════════════════════════════════

[general]
enabled = yes
pretty = yes
allowed_origins = http://127.0.0.1:8088

[asterisk]
type = user
password = <GENERAR_POR_SECRET_32+_chars>
read_only = no
