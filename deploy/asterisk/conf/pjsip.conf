; ═══════════════════════════════════════════════════════════════
;  pjsip.conf — IaaS-RonSys Central Telefónica (F2, Spec 05 §3.3)
;  Trunk SIP 4 canales, SOLO G.711 ulaw/alaw (D2), seguridad D3.
;  ⚠️ Credenciales PLACEHOLDER (D3): generar por secret antes de activar:
;       openssl rand -hex 24   (usuario/password del proveedor + AMI/ARI)
;  ⚠️ Trunk real PENDIENTE del cliente (número + proveedor): ver README.
; ═══════════════════════════════════════════════════════════════

; ── Transporte (D1/D2) ──────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; D2 NAT: IP pública + red local (port-forward UDP 5060 pendiente del router)
; Las llamadas desde 192.168.1.0/24 (softphones QA) usan la IP local;
; el resto recibe la IP pública en el SDP (CA-F2.10).
external_media_address=190.235.163.29
external_signaling_address=190.235.163.29
localnet=192.168.1.0/24

; ── Trunk del proveedor (D2/D3) ─────────────────────────────────
; endpoint: contexto de entrada from-pstn (grabación + ring operador)
[provider-trunk]
type=endpoint
context=from-pstn
disallow=all
allow=ulaw
allow=alaw                     ; SOLO G.711 (D2: sin transcoding, sin G.729)
direct_media=no                ; media siempre por Asterisk (NAT-friendly)
rtp_symmetric=yes              ; D2
force_rport=yes
; D3: ACL por IPs del proveedor — REEMPLAZAR por las IPs reales antes del go-live
permit=203.0.113.10/32         ; PLACEHOLDER — IP del proveedor (cambiar)
deny=0.0.0.0/0
auth=provider-trunk-auth
aors=provider-trunk-aor

[provider-trunk-auth]
type=auth
auth_type=userpass
username=<USER_PROVEEDOR>                 ; PLACEHOLDER (D3)
password=<PASSWORD_PROVEEDOR_LARGA_ALEATORIA>  ; PLACEHOLDER (D3)

[provider-trunk-aor]
type=aor
max_contacts=1
qualify_frequency=30           ; D2: keepalive NAT

; ── Registro saliente al proveedor (OPCIONAL) ───────────────────
; Descomentar SOLO si el proveedor exige REGISTER (auth por IP estático
; no necesita registro). PLACEHOLDER: reemplazar URIs.
; [provider-trunk-reg]
; type=registration
; transport=transport-udp
; auth=provider-trunk-auth
; server_uri=sip:<SIP_DOMAIN_PROVEEDOR>
; client_uri=sip:<USER_PROVEEDOR>@<SIP_DOMAIN_PROVEEDOR>
; retry_interval=60
; max_retries=10

; ─────────────────────────────────────────────────────────────────
;  SOLO QA — Endpoints locales de prueba (softphones Linphone/MicroSIP/
;  Zoiper). Descomentar para la simulación SIP local SIN trunk (dry-run
;  F1, Spec 05 §5 D-13/08). Extensiones: 100 (operador), 200/201 (clientes
;  de prueba). NO usar en producción con el trunk real activo.
; ─────────────────────────────────────────────────────────────────
; [100]
; type=endpoint
; context=from-internal
; disallow=all
; allow=ulaw
; allow=alaw
; direct_media=no
; rtp_symmetric=yes
; force_rport=yes
; auth=100-auth
; aors=100-aor
;
; [100-auth]
; type=auth
; auth_type=userpass
; username=100
; password=qa100local           ; SOLO QA — placeholder local
;
; [100-aor]
; type=aor
; max_contacts=1
; qualify_frequency=30
;
; [200]
; type=endpoint
; context=from-internal
; disallow=all
; allow=ulaw
; allow=alaw
; direct_media=no
; rtp_symmetric=yes
; force_rport=yes
; auth=200-auth
; aors=200-aor
;
; [200-auth]
; type=auth
; auth_type=userpass
; username=200
; password=qa200local           ; SOLO QA — placeholder local
;
; [200-aor]
; type=aor
; max_contacts=1
; qualify_frequency=30
;
; [201]
; type=endpoint
; context=from-internal
; disallow=all
; allow=ulaw
; allow=alaw
; direct_media=no
; rtp_symmetric=yes
; force_rport=yes
; auth=201-auth
; aors=201-aor
;
; [201-auth]
