# ═══════════════════════════════════════════════════════════════
#  IaaS-RonSys — Infraestructura Base Compartida
#
#  Servicios compartidos entre entornos (QA y Producción):
#    - PostgreSQL 16
#    - Redis 7
#    - RabbitMQ 4 (infra lista, motor pendiente)
#
#  Uso:
#    docker compose up -d                    # Solo infra base
#    docker compose -f docker-compose.yml -f docker-compose.qa.yml up -d    # QA
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d  # Producción
# ═══════════════════════════════════════════════════════════════

services:
  # ─── Base de Datos ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: iaas-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ron123}
      POSTGRES_DB: ${POSTGRES_DB:-iaas_ronsys}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ron} -d ${POSTGRES_DB:-iaas_ronsys}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Cache ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: iaas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Cola de Mensajes ──────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: iaas-rabbitmq
    ports:
      - "5672:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Central Telefónica (F2 — Asterisk A20, Spec 05 §3.3) ──
  # D1: host network evita el docker-proxy UDP (degradaría RTP/jitter).
  # Sin sección ports: con network_mode: host el contenedor usa los puertos
  # del host directamente (SIP/UDP 5060, RTP/UDP 10000-10100, AMI 5038 y ARI
  # 8088 bind 127.0.0.1 — nunca expuestos, D3).
  asterisk:
    image: asterisk/asterisk:20            # A20 LTS, incluye AMI + ARI
    container_name: iaas-asterisk
    network_mode: host                     # D1
    restart: unless-stopped
    volumes:
      - ./deploy/asterisk/conf:/etc/asterisk:ro   # config inmutable (credenciales por secret, D3)
      - asterisk_recordings:/var/spool/asterisk/monitor   # grabaciones MixMonitor (R1)
    environment:
      ASTERISK_USER: asterisk
      ASTERISK_GROUP: asterisk
    healthcheck:
      # host network: no aplica healthcheck HTTP; el CLI de Asterisk es el probe.
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  asterisk_recordings:
