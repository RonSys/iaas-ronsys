name: CI

on:
  push:
    branches: [main, fase0-real, ron/*]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r apps/backend/requirements.txt
      - name: Lint backend (ruff)
        run: |
          pip install ruff
          cd apps/backend && ruff check app/ tests/
